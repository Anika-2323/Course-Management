services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: scm_backend
    ports:
      - "5000:5000"
    env_file:
      - ./backend/.env
    restart: unless-stopped

  frontend:
    build:
      context: ./react-frontend
      dockerfile: Dockerfile
    container_name: scm_frontend
    ports:
      - "5173:80"
    depends_on:
      - backend
    restart: unless-stopped